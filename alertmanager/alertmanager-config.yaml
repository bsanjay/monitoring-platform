apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-kube-prometheus-stack-alertmanager
  namespace: monitoring

stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:

      receiver: default

      group_by:
        - alertname
        - namespace
        - cluster

      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:

      - receiver: critical-slack

        matchers:
        - severity="critical"

      - receiver: warning-slack

        matchers:
        - severity="warning"

    inhibit_rules:

    - source_matchers:
      - severity="critical"

      target_matchers:
      - severity="warning"

      equal:
      - instance

    receivers:

    - name: default

      slack_configs:
      - api_url: https://hooks.slack.com/services/XXX
        channel: '#alerts'

    - name: critical-slack

      slack_configs:
      - api_url: https://hooks.slack.com/services/XXX
        channel: '#critical-alerts'

    - name: warning-slack

      slack_configs:
      - api_url: https://hooks.slack.com/services/XXX
        channel: '#warning-alerts'

