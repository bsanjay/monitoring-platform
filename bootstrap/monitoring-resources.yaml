apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-resources
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/bsanjay/monitoring-platform.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
